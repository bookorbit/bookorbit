name: CI
run-name: >-
  ${{ (github.event_name == 'push' && format('CI - {0} ({1})', github.event.head_commit.message, github.ref_name)) || (github.event_name == 'pull_request' && format('CI - PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)) || 'CI - manual' }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "26"
  PNPM_VERSION: "11"

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # For push events dorny/paths-filter diffs github.event.before..github.sha.
      # New-branch pushes (before = 0000...) are handled by treating all files as changed.
      # Force-push edge cases (before SHA no longer reachable) may mark all files changed too.
      - name: Compute changed scopes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            server:
              - 'server/**'
              # Server tests assert against the plugin sources, so plugin-only
              # changes can break them.
              - 'koreader-plugin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/actions/setup-node-pnpm/action.yml'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/actions/setup-node-pnpm/action.yml'
              - '.github/workflows/ci.yml'
              # Client tests read the Crowdin workflow's catalog list.
              - '.github/workflows/crowdin-translations.yml'

      # An unchanged package gets no runner at all: even a job that only decides
      # to skip is billed a full minute.
      - name: Select packages to check
        id: select
        shell: bash
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          SERVER_CHANGED: ${{ steps.changes.outputs.server }}
          CLIENT_CHANGED: ${{ steps.changes.outputs.client }}
        run: |
          selected=""
          if [[ "$MANUAL" == "true" || "$SERVER_CHANGED" == "true" ]]; then selected='"server"'; fi
          if [[ "$MANUAL" == "true" || "$CLIENT_CHANGED" == "true" ]]; then selected="${selected:+$selected,}\"client\""; fi
          echo "packages=[$selected]" >> "$GITHUB_OUTPUT"
          echo "packages=[$selected]"

  # Lint, format, type check and tests share one job per package so the
  # dependency install is paid once instead of three times.
  checks:
    name: Checks (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.packages != '[]'
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          prefetch: "true"

      - name: Lint
        run: pnpm --filter "$PACKAGE" lint:check

      - name: Format
        run: pnpm --filter "$PACKAGE" format:check

      - name: Build shared types
        if: matrix.package == 'client'
        run: pnpm --filter @bookorbit/types build

      - name: Type check
        run: pnpm --filter "$PACKAGE" type-check

      - name: Tests
        shell: bash
        run: |
          if [[ "$PACKAGE" == "server" ]]; then
            pnpm --filter server exec vitest --run --reporter=default --reporter=github-actions
          else
            pnpm --filter client exec vitest --run
          fi
