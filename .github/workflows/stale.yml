name: Stale Issues

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  stale:
    name: Mark and Close Stale Issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-pr-label: stale
          remove-pr-stale-when-updated: false
          exempt-issue-labels: "pinned,security"
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 14 days
            unless there is new activity. If this is still relevant, please leave a
            comment or update the issue.
          close-issue-message: >
            Closing due to inactivity. Feel free to reopen if this is still relevant.
