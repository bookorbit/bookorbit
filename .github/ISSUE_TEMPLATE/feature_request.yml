name: Feature Request
description: Suggest a new feature or improvement for BookOrbit
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's your idea?
      description: A clear description of the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Help us understand the motivation behind this request.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: Mockups, examples from other apps, implementation ideas, alternatives you've considered.

  - type: dropdown
    id: contribution
    attributes:
      label: Want to help?
      options:
        - "Yes, I'd like to implement this"
        - "I can help test and give feedback"
        - "Just sharing the idea"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Before implementing this request

        If you want to implement this request, comment on the issue with your proposed approach after
        submitting it. Wait for a maintainer to approve the approach and assign the issue to you before
        writing code or opening a pull request, including a draft.

        If nobody responds within seven days, leave one polite follow-up and @mention the maintainers
        or contributors already involved in the issue. People may have missed the original notification,
        so a reminder is welcome. No response does not count as approval.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this hasn't been requested yet.
          required: true
        - label: If I implement this, I will wait for maintainer approval and assignment before writing code or opening a pull request.
          required: true
