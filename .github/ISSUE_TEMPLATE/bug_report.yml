name: Bug Report
description: Report a bug in BookOrbit
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Your setup
      placeholder: |
        - BookOrbit version/image tag: latest
        - Deployment: Docker / manual
        - OS: Ubuntu 22.04
        - Browser: Firefox 124
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: Run `docker logs <container-name>` and paste anything relevant here.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag and drop screenshots here if applicable.

  - type: markdown
    attributes:
      value: |
        ### Before implementing a fix

        If you want to implement a fix, comment on the issue with your proposed approach after submitting
        it. Wait for a maintainer to approve the approach and assign the issue to you before writing code
        or opening a pull request, including a draft.

        If nobody responds within seven days, leave one polite follow-up and @mention the maintainers or
        contributors already involved in the issue. People may have missed the original notification, so
        a reminder is welcome. No response does not count as approval.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this hasn't been reported yet.
          required: true
        - label: If I implement this fix, I will wait for maintainer approval and assignment before writing code or opening a pull request.
          required: true
