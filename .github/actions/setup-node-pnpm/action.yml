name: Setup Node and pnpm
description: Set up Node.js and pnpm, and optionally install dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "26"
  install:
    description: Whether to run pnpm install.
    required: false
    default: "true"
  cache:
    description: Whether to enable pnpm dependency caching.
    required: false
    default: "true"
  cache-dependency-path:
    description: Path(s) used to generate the cache key.
    required: false
    default: "pnpm-lock.yaml"
  prefetch:
    description: Whether to run pnpm fetch before installation.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install the workspace's pnpm version
      id: pnpm
      shell: bash
      run: |
        package_manager=$(node -p 'require("./package.json").packageManager')
        npm install --global "$package_manager"
        echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"

    # pnpm must be on PATH before its store path can be resolved for cache keying,
    # so caching is configured after installing pnpm.
    - name: Get pnpm store directory
      if: ${{ inputs.cache == 'true' }}
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ steps.pnpm.outputs.version }}-store-${{ hashFiles(inputs.cache-dependency-path) }}
        restore-keys: |
          ${{ runner.os }}-pnpm-${{ steps.pnpm.outputs.version }}-store-

    # onnxruntime-node's postinstall runs during prefetch as well as installation. CI only uses the
    # CPU binding bundled in the npm package, so skip the CUDA provider download in both steps.
    - name: Prefetch dependencies
      if: ${{ inputs.prefetch == 'true' }}
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: pnpm fetch --frozen-lockfile

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: pnpm install --frozen-lockfile
